name: backend
on:
  push:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: Type-check the Edge Functions and scripts
        run: deno check --config backend/supabase/functions/deno.json backend/supabase/functions/lite/index.ts backend/supabase/functions/lite-indexer/index.ts backend/scripts/*.ts
      - name: Unit tests (verifier, auth, CCTP encoders, router)
        run: deno test -A --config backend/supabase/functions/deno.json backend/tests/unit/
      - name: Migrations + schema tests (RLS closed to anon/authenticated, budget, candles)
        run: |
          psql -h localhost -U postgres -c "create role anon nologin; create role authenticated nologin;"
          for f in backend/supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -h localhost -U postgres -f "$f"; done
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -f backend/tests/sql/lite_schema_test.sql
      # The testnet journey (backend/tests/e2e/lite_e2e.ts) needs a funded sponsor and network access to testnet;
      # run it manually or from a scheduled job with SPONSOR_SECRET as a repository secret.
