name: backend
on:
  push:
    paths: ["backend/**", "ios/Packages/StellarKit/Tests/LiteClientTests/Fixtures/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "ios/Packages/StellarKit/Tests/LiteClientTests/Fixtures/**"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: Type-check every entry point (both functions, the API contract, the scripts, the e2e driver and its phases, the vectors)
        run: >-
          deno check --config backend/supabase/functions/deno.json
          backend/supabase/functions/lite/index.ts backend/supabase/functions/lite-indexer/index.ts
          backend/supabase/functions/_shared/contract.ts
          backend/scripts/*.ts backend/scripts/local/*.ts backend/tests/e2e/lite_e2e.ts backend/tests/e2e/phases/*.ts
          backend/tests/vectors/gen-vectors.ts
      - name: Unit tests (routes, environment and indexer, verifier, auth and HTTP, CCTP encoders)
        run: deno test -A --config backend/supabase/functions/deno.json backend/tests/unit/
      - name: API contract (every fixture type-checks as its contract type; the phone's copies match)
        run: |
          deno test --allow-read --allow-run --config backend/supabase/functions/deno.json backend/tests/fixtures/
          backend/tests/fixtures/sync.sh --check
      # As backend/scripts/schema-test.sh runs them: the roles (lite_api with the attributes migration 20261013000004
      # gives it), every migration in filename order, then each SQL test on its own copy of the migrated database.
      - name: Migrations + every SQL test (each in a transaction it rolls back)
        run: |
          psql() { command psql -X -q -v ON_ERROR_STOP=1 -h localhost -U postgres "$@"; }
          createdb -h localhost -U postgres -E UTF8 lite
          psql -d lite -c "do \$\$ begin
              if not exists (select 1 from pg_roles where rolname = 'anon') then create role anon nologin; end if;
              if not exists (select 1 from pg_roles where rolname = 'authenticated') then create role authenticated nologin; end if;
              if not exists (select 1 from pg_roles where rolname = 'lite_api') then
                create role lite_api login noinherit nocreatedb nocreaterole nobypassrls connection limit 20;
              end if;
            end \$\$;"
          for f in backend/supabase/migrations/*.sql; do echo "migration $f"; psql -d lite -f "$f"; done
          n=0
          for f in backend/tests/sql/*.sql; do
            n=$((n + 1))
            createdb -h localhost -U postgres -T lite "test_$n"
            echo "test $f"
            psql -d "test_$n" -f "$f"
          done
      # The testnet journey (backend/tests/e2e/lite_e2e.ts) needs a funded sponsor and network access to testnet;
      # run it manually or from a scheduled job with SPONSOR_SECRET as a repository secret.
