[workspace]
resolver = "2"
members = ["launch-token", "launchpad", "moments"]
exclude = ["tools"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LicenseRef-DyorHQ-Proprietary"
publish = false
rust-version = "1.84"

[workspace.dependencies]
# OpenZeppelin stellar-tokens 0.7.2 requires soroban-sdk ^26.1. Contracts built on SDK 26 run unchanged on
# protocol 29 (testnet, 2026-10-11).
soroban-sdk = "=26.1.1"
stellar-tokens = "=0.7.2"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
