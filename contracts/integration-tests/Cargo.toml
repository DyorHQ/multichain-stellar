[package]
name = "dyor-integration-tests"
description = "Cross-contract journeys, probes, property and budget tests over the built v2 WASMs. Test-only."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
doctest = false

# The library is the shared harness of the tests in tests/ (the deployment of §3.4 over the dist WASMs). It is host-only:
# build.sh never builds this crate, and no contract crate depends on it.
[dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
dyor-common = { workspace = true }
proptest = { workspace = true }
