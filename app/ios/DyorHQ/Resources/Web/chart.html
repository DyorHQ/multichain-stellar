<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; width: 100%; background: transparent; overflow: hidden;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #chart { position: absolute; inset: 0; }
  #legend { position: absolute; top: 8px; left: 10px; z-index: 3; pointer-events: none;
    font: 600 11px/1.35 -apple-system, system-ui, sans-serif; letter-spacing: 0.2px;
    display: flex; gap: 8px; flex-wrap: wrap; opacity: 0; transition: opacity .12s ease; }
  #legend .k { opacity: 0.55; font-weight: 500; }
</style>
</head>
<body>
  <div id="chart"></div>
  <div id="legend"></div>
  <script src="lightweight-charts.standalone.production.js"></script>
  <script>
  (function () {
    const el = document.getElementById('chart');
    const legend = document.getElementById('legend');
    const attr = document.getElementById('attr');
    let palette = {
      up: '#1F9E5B', down: '#D2483F', text: '#8A8A8E', grid: 'rgba(120,120,128,0.16)',
      border: 'rgba(120,120,128,0.20)', crosshair: '#8A8A8E', up2: 'rgba(31,158,91,0.5)', down2: 'rgba(210,72,63,0.5)'
    };

    const chart = LightweightCharts.createChart(el, {
      autoSize: true,
      layout: { background: { type: 'solid', color: 'transparent' }, textColor: palette.text, fontFamily: '-apple-system, system-ui, sans-serif', fontSize: 10 },
      grid: { vertLines: { color: palette.grid }, horzLines: { color: palette.grid } },
      rightPriceScale: { borderColor: palette.border, scaleMargins: { top: 0.08, bottom: 0.22 } },
      timeScale: { borderColor: palette.border, timeVisible: true, secondsVisible: false, rightOffset: 3, barSpacing: 8 },
      crosshair: {
        mode: LightweightCharts.CrosshairMode.Normal,
        vertLine: { color: palette.crosshair, width: 1, style: 3, labelBackgroundColor: palette.crosshair },
        horzLine: { color: palette.crosshair, width: 1, style: 3, labelBackgroundColor: palette.crosshair },
      },
      handleScale: { axisPressedMouseMove: true }, handleScroll: true,
      localization: { priceFormatter: (p) => formatPrice(p) },
    });

    let precision = 2, minMove = 0.01;
    const candles = chart.addCandlestickSeries({
      upColor: palette.up, downColor: palette.down, borderVisible: false,
      wickUpColor: palette.up, wickDownColor: palette.down,
    });
    const volume = chart.addHistogramSeries({
      priceScaleId: '', priceFormat: { type: 'volume' }, color: palette.up2,
      lastValueVisible: false, priceLineVisible: false, // no last-value tag — it overflowed the width
    });
    volume.priceScale().applyOptions({ scaleMargins: { top: 0.82, bottom: 0 } });

    let lastData = [];
    let hasFit = false;

    function formatPrice(p) {
      if (p == null || isNaN(p)) return '';
      return p.toLocaleString('en-US', { minimumFractionDigits: precision, maximumFractionDigits: precision });
    }

    function decimalsFor(v) {
      const a = Math.abs(v);
      if (a === 0) return 2;
      if (a >= 1000) return 2;
      if (a >= 1) return 2;
      if (a >= 0.1) return 4;
      if (a >= 0.001) return 5;
      return 6;
    }

    function applyPalette() {
      chart.applyOptions({
        layout: { textColor: palette.text },
        grid: { vertLines: { color: palette.grid }, horzLines: { color: palette.grid } },
        rightPriceScale: { borderColor: palette.border },
        timeScale: { borderColor: palette.border },
        crosshair: {
          vertLine: { color: palette.crosshair, labelBackgroundColor: palette.crosshair },
          horzLine: { color: palette.crosshair, labelBackgroundColor: palette.crosshair },
        },
      });
      candles.applyOptions({ upColor: palette.up, downColor: palette.down, wickUpColor: palette.up, wickDownColor: palette.down });
    }

    function paintVolume(rows) {
      return rows.map((c) => ({ time: c.time, value: c.volume || 0, color: c.close >= c.open ? palette.up2 : palette.down2 }));
    }

    // Dedupe + sort ascending; Lightweight Charts requires strictly increasing unique times.
    function normalize(rows) {
      const byTime = new Map();
      for (const c of rows) byTime.set(c.time, c);
      return Array.from(byTime.values()).sort((a, b) => a.time - b.time);
    }

    // The legend's labels, in the app's language once the app sends them.
    let legendLabels = { o: 'O', h: 'H', l: 'L', c: 'C' };

    function escapeHTML(text) {
      return String(text).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
    }

    // The app's settings: the palette, and the app's language. Dates on the time scale and the crosshair are written in
    // `locale` (the app's language, not the device's); prices keep the app's one number style (formatPrice).
    window.__configure = function (p) {
      palette = Object.assign(palette, p.palette || {});
      applyPalette();
      if (p.locale) chart.applyOptions({ localization: { locale: p.locale, priceFormatter: (v) => formatPrice(v) } });
      if (p.legend) legendLabels = Object.assign(legendLabels, p.legend);
    };

    window.__setData = function (rows) {
      lastData = normalize(rows);
      if (lastData.length) {
        const ref = lastData[lastData.length - 1].close;
        precision = decimalsFor(ref); minMove = Math.pow(10, -precision);
        candles.applyOptions({ priceFormat: { type: 'price', precision, minMove } });
      }
      candles.setData(lastData.map((c) => ({ time: c.time, open: c.open, high: c.high, low: c.low, close: c.close })));
      volume.setData(paintVolume(lastData));
      // Frame the data only on the first load; later refreshes keep the range the user is looking at.
      if (!hasFit && lastData.length) { chart.timeScale().fitContent(); hasFit = true; }
    };

    // Update or append the last bar without a full reset (keeps the user's zoom/scroll).
    window.__update = function (c) {
      if (!c) return;
      candles.update({ time: c.time, open: c.open, high: c.high, low: c.low, close: c.close });
      volume.update({ time: c.time, value: c.volume || 0, color: c.close >= c.open ? palette.up2 : palette.down2 });
    };

    // Horizontal price lines for the open position and resting orders: entry, liquidation, take-profit / stop-loss,
    // and each resting limit order. Fully replaced on every call so a closed position leaves no stale line behind.
    let priceLines = [];
    window.__setLevels = function (levels) {
      for (const line of priceLines) { try { candles.removePriceLine(line); } catch (e) {} }
      priceLines = [];
      if (!levels || !levels.length) return;
      for (const lv of levels) {
        if (lv.price == null || isNaN(lv.price) || lv.price <= 0) continue;
        priceLines.push(candles.createPriceLine({
          price: lv.price,
          color: lv.color,
          lineWidth: lv.width || 1,
          lineStyle: lv.dashed ? 2 : 0, // 0 = solid, 2 = dashed
          axisLabelVisible: true,
          title: lv.title || '',
        }));
      }
    };

    // Buy/sell fill markers under/over the bar they filled in.
    window.__setMarkers = function (marks) {
      if (!marks || !marks.length) { candles.setMarkers([]); return; }
      const rows = marks.map((m) => ({
        time: m.time,
        position: m.side === 'buy' ? 'belowBar' : 'aboveBar',
        color: m.side === 'buy' ? palette.up : palette.down,
        shape: m.side === 'buy' ? 'arrowUp' : 'arrowDown',
        text: m.text || '',
      })).sort((a, b) => a.time - b.time);
      candles.setMarkers(rows);
    };

    chart.subscribeCrosshairMove((param) => {
      if (!param.time || !param.point) { legend.style.opacity = '0'; return; }
      const c = param.seriesData.get(candles);
      if (!c) { legend.style.opacity = '0'; return; }
      const up = c.close >= c.open;
      const col = up ? palette.up : palette.down;
      legend.innerHTML =
        '<span><span class="k">' + escapeHTML(legendLabels.o) + '</span> ' + formatPrice(c.open) + '</span>' +
        '<span><span class="k">' + escapeHTML(legendLabels.h) + '</span> ' + formatPrice(c.high) + '</span>' +
        '<span><span class="k">' + escapeHTML(legendLabels.l) + '</span> ' + formatPrice(c.low) + '</span>' +
        '<span style="color:' + col + '"><span class="k" style="color:inherit;opacity:.55">' + escapeHTML(legendLabels.c) + '</span> ' + formatPrice(c.close) + '</span>';
      legend.style.opacity = '1';
    });

    // Signal readiness so the native side can push data it may have queued.
    function ready() {
      try { window.webkit.messageHandlers.ready.postMessage('ready'); } catch (e) {}
    }
    if (document.readyState === 'complete') ready(); else window.addEventListener('load', ready);
  })();
  </script>
</body>
</html>
