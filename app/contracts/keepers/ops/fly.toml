# DyorHQ keepers on Fly.io (build 17 K4; owner decision 2026-09-29). One always-on Machine running supercronic, with no
# public services and its state on one volume. Deployed only through ops/deploy-fly.sh, from a bundle of a reviewed
# commit (ops/bundle.sh); the owner steps are in DyorHQ/internal (ios-app/docs/RUNBOOK-keepers-fly.md).
#
# Exactly one Machine sends, always: two would send from the same keys (nonce clashes, a duplicate graduation, and a
# daily cap each). The volume does not enforce that: `fly scale count 2` or `fly machine clone` gives the new Machine
# its own volume (empty, or from a snapshot). So the entrypoint lets a unit send only on the Machine the
# KEEPER_MACHINE_ID secret names (checked against FLY_MACHINE_ID); any other Machine runs dry runs, and a send flag at
# 1 fails its runs (healthchecks /fail). deploy-fly.sh passes --ha=false, refuses an app with more than one Machine,
# checks the count after the deploy and prints the Machine id to pin. The entrypoint also refuses to run without the
# volume.
#
# No [http_service], [[services]] or [checks]: nothing listens, so the app has no public or Flycast address, Fly Proxy
# never routes to it and never auto-stops it (auto stop/start is a Fly Proxy feature for Machines with services).
# Liveness is healthchecks.io, pinged by run-keeper.sh. Secrets (keystores, passwords, the webhook, the ping URLs and
# the send flags) are Fly secrets, never [env]: see keeper.env.example for their names.

app = "dyorhq-keepers"
# Ashburn, Virginia: next to rpc4 (Infura's Monad gateway runs in AWS us-east-1) and to rpc3 (Ankr) in the US East, and
# Fly's base price region.
primary_region = "iad"
# supercronic lets running jobs finish on SIGTERM; 300 s is Fly's maximum and covers a signing run's 240 s deadline
# (run-keeper.sh): a send never outlasts that deadline (cast's receipt wait and kill timer shrink to the time left, and
# a send is not started with less than 75 s left), so a deploy or a secrets change never stops a send half way. A send
# is saved before and after cast runs, so even a kill (out of memory, a host fault) loses no spend: the next run reports
# a send it left in flight as an unknown outcome.
kill_signal = "SIGTERM"
kill_timeout = 300
# Two keeper runs can overlap (about 105 MB each, plus cast): swap absorbs a spike instead of the OOM killer.
swap_size_mb = 512

[build]
  dockerfile = "Dockerfile"

[deploy]
  strategy = "rolling"
  max_unavailable = 1

[env]
  TZ = "UTC"

[mounts]
  source = "keeper_state"
  destination = "/data"
  initial_size = "1gb"
  snapshot_retention = 14

[[restart]]
  policy = "always"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
